# Explicit base for the supported-core matrix; variant EXTRA_CONF_FILE
# fragments are merged afterward and may turn off BLE or USB.
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_SETTINGS=y
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_CONN_SHOW_USB=y
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_ZMK_BATTERY_REPORTING=y
