name: Fork review

on:
  push:
    branches: ["codex/rgbled-widget-review"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
      options: --cpus 3 --memory 6g
    env:
      ZMK_TEST_MODE: full
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      OWNER_TEST_BUILD_PARALLELISM: 1
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compiler and checker
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc-multilib python3-venv
          python3 -m venv /tmp/fork-review-checkers
          /tmp/fork-review-checkers/bin/python -m pip install pre-commit==4.7.0
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Full controlled runtime and caller matrix
        run: |
          python3 tests/runtime/run.py
          python3 tests/review-caller/run.py "$PWD/caller-output"
